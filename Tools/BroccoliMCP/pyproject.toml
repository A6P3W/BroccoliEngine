[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "broccoli-mcp"
version = "0.1.0"
description = "MCP stdio bridge for the BROCCOLI ENGINE Automation API"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "anyio==4.10.0",
  "httpx==0.28.1",
  "mcp==1.26.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "ruff>=0.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["broccoli_mcp"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
indent-width = 2
line-length = 100
required-version =">=0.16.0"
target-version = "py311"

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
