[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "broccoli-control"
version = "0.1.0"
description = "Shared control client for the BROCCOLI ENGINE Automation API"
requires-python = ">=3.11,<3.15"
dependencies = ["httpx==0.28.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff>=0.16.0"]

[tool.hatch.build.targets.wheel]
packages = ["broccoli_control"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
indent-width = 2
line-length = 100
required-version = ">=0.16.0"
target-version = "py311"

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
