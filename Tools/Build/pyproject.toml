[project]
name = "broccoli-build-tools"
version = "0.1.0"
description = "BroccoliEngine Build and Packaging Tools"
requires-python = ">=3.11,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.9.0",
]

[build-system]
requires = ["flit_core>=3.2,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "broccoli_build"
[tool.pytest.ini_options]
python_functions = ["Test*"]